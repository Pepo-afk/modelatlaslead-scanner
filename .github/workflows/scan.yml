name: Daily Monitor, Signals & Emails

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install axios cheerio @supabase/supabase-js rss-parser

      # 1. Scan company websites
      - name: Run Web Scanner
        run: node scanner.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 2. Collect Google News articles (no signal creation)
      - name: Collect Google News Articles
        run: node google-news-scanner.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 3. Generate signals (hybrid: keyword + AI, cap disabled)
      - name: Generate Signals
        run: node generate-signals.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERVER_API_KEY: ${{ secrets.SERVER_API_KEY }}
          DISABLE_CAP: true          # ← temporary test line

      # 4. Send emails for pending signals
      - name: Send Emails
        run: node send-emails.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
