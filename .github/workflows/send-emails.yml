name: Send App Emails

on:
  workflow_dispatch: # Allows you to run it manually
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM UTC

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This installs the tools needed for the new JS file
      - name: Install dependencies
        run: npm install @supabase/supabase-js nodemailer

      - name: Send emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SERVER_API_KEY: ${{ secrets.SERVER_API_KEY }}
        run: node send-emails.js
