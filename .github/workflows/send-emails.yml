name: Send Cold Emails

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send emails
        env:
          MAILTRAP_SMTP_USER: ${{ secrets.MAILTRAP_SMTP_USER }}
          MAILTRAP_SMTP_PASSWORD: ${{ secrets.MAILTRAP_SMTP_PASSWORD }}
        run: python send_emails.py leads.json

      - name: Commit contacted list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add contacted.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update contacted list"
          git push
