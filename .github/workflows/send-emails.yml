name: Send Cold Emails

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CRITICAL: Install Nodemailer and Supabase Client
      - name: Install dependencies
        run: npm install @supabase/supabase-js nodemailer

      - name: Send emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node send-emails.js

      - name: Commit contacted list (if you use it)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add contacted.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update contacted list"
          git push
