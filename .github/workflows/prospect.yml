name: Find SDR Leads with LinkedIn

on:
  workflow_dispatch:

jobs:
  find-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- STAGE 1: FIND LINKEDIN PROFILES ----------
      - name: Find LinkedIn Profiles with Bright Data
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_ZONE: ${{ secrets.BRIGHT_DATA_ZONE }}
        run: |
          COMPANIES=("belkins.io" "builtforb2b.com" "punchb2b.com" "qualitycontactsolutions.com")
          TITLES=("SDR" "BDR" "Sales Development Representative" "Business Development Representative")

          > linkedin-profiles.json

          for COMPANY in "${COMPANIES[@]}"; do
            for TITLE in "${TITLES[@]}"; do
              echo "Searching for $TITLE at $COMPANY..."
              QUERY="site:linkedin.com/in \"$TITLE\" \"$COMPANY\""
              ENCODED_QUERY=$(echo "$QUERY" | jq -sRr @uri)

              curl -s -X POST "https://api.brightdata.com/request" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $BRIGHT_DATA_API_KEY" \
                -d "{
                  \"zone\": \"$BRIGHT_DATA_ZONE\",
                  \"url\": \"https://www.google.com/search?q=$ENCODED_QUERY\",
                  \"format\": \"json\",
                  \"data_format\": \"json\"
                }" > result.json

              python3 -c "
import json, re, sys
try:
    data = json.load(open('result.json'))
    for item in data.get('organic', []):
        url = item.get('link', '')
        title = item.get('title', '')
        snippet = item.get('snippet', '')
        name_match = re.match(r'^([^-]+)', title)
        if name_match and 'linkedin.com/in/' in url:
            name = name_match.group(1).strip()
            print(json.dumps({'name': name, 'url': url, 'snippet': snippet, 'company': '$COMPANY'}))
except Exception as e:
    pass
" >> linkedin-profiles.json
            done
          done

          echo "Found $(wc -l < linkedin-profiles.json) profiles."

      # ---------- STAGE 2: FIND EMAILS WITH PROSPECTOR MCP ----------
      - name: Install Prospector MCP
        run: npm install -g prospector-mcp

      - name: Start Prospector MCP Server
        run: |
          prospector-mcp --port 3100 &
          echo "PROSPECTOR_PID=$!" >> $GITHUB_ENV
          sleep 8

      - name: Find Emails with Prospector
        run: |
          python3 << 'EOF'
import json, subprocess, time, os, re
import requests

# Read discovered profiles
profiles = [json.loads(line) for line in open('linkedin-profiles.json') if line.strip()]

leads = []
for p in profiles:
    name = p['name']
    company_domain = p.get('company', '')

    # Extract domain from the company field (fallback to snippet)
    if not company_domain:
        for word in p.get('snippet', '').split():
            if '.' in word and not word.startswith('linkedin'):
                potential_domain = word.strip('.,;:()[]{}')
                if potential_domain.endswith(('.com', '.io', '.ai')):
                    company_domain = potential_domain
                    break

    if not company_domain:
        continue

    # Call Prospector MCP via HTTP (assuming it exposes an HTTP endpoint)
    # NOTE: The exact endpoint may differ. Check the prospector-mcp docs.
    try:
        response = requests.post('http://localhost:3100/mcp', json={
            'tool': 'find_emails',
            'params': {'name': name, 'domain': company_domain}
        }, timeout=30)
        if response.status_code == 200:
            email_data = response.json()
            if email_data.get('email'):
                leads.append({
                    'name': name,
                    'email': email_data['email'],
                    'domain': company_domain,
                    'linkedin': p['url']
                })
                print(f"  Found: {name} -> {email_data['email']}")
    except Exception as e:
        print(f"  Error for {name}: {e}")

# Write leads to leads.json
with open('leads.json', 'w') as f:
    json.dump([{'email': l['email']} for l in leads], f, indent=2)

print(f"\nTotal verified emails: {len(leads)}")
for l in leads[:20]:
    print(f"  {l['name']:25s} | {l['email']:35s} | {l['domain']}")
EOF

      - name: Stop Prospector MCP Server
        if: always()
        run: kill ${{ env.PROSPECTOR_PID }} || true

      # ---------- COMMIT RESULTS ----------
      - name: Commit leads
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add leads.json linkedin-profiles.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update leads from LinkedIn"
          git push
