name: Find SDRs

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Intel-Harvester
        run: git clone https://github.com/itallstartedwithaidea/intel-harvester.git

      - name: Install dependencies
        run: |
          cd intel-harvester
          pip install -r requirements.txt

      - name: Run Intel-Harvester on domains
        run: |
          cd intel-harvester
          python harvest.py ../domains.txt \
            --output ../contacts.csv \
            --skip-ads \
            --delay 2 \
            --max-pages 10

      - name: Filter for SDR/BDR titles
        run: |
          python3 << 'EOF'
          import csv
          import json

          with open('contacts.csv') as f:
              reader = csv.DictReader(f)
              contacts = list(reader)

          print(f"Total contacts: {len(contacts)}")
          print(f"Columns: {list(contacts[0].keys()) if contacts else 'none'}")

          sdr_keywords = ['sdr', 'bdr', 'sales development', 'business development',
                          'outbound', 'lead gen', 'appointment set', 'prospecting']

          sdrs = []
          seen = set()
          for c in contacts:
              title = (c.get('title') or '').lower()
              email = c.get('email') or ''
              if not email or email in seen:
                  continue
              if any(kw in title for kw in sdr_keywords):
                  sdrs.append({
                      'email': email,
                      'name': c.get('name', ''),
                      'title': c.get('title', ''),
                      'domain': c.get('domain', ''),
                      'confidence': c.get('confidence', '')
                  })
                  seen.add(email)

          with open('leads.json', 'w') as f:
              json.dump([{'email': s['email']} for s in sdrs], f, indent=2)

          print(f"\nSDR/BDR leads found: {len(sdrs)}")
          for s in sdrs[:20]:
              print(f"  {s['name']:25s} | {s['title']:30s} | {s['email']}")

          # Also save the full enriched list
          with open('sdrs-full.json', 'w') as f:
              json.dump(sdrs, f, indent=2)
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add leads.json sdrs-full.json contacts.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update SDR leads"
          git push
