name: Find SDR Leads

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone ICP Scout
        run: git clone https://github.com/GrimmReaper0/icp-scout.git

      - name: Create SearXNG settings
        run: |
          mkdir -p searxng-config
          cat > searxng-config/settings.yml << 'EOF'
          use_default_settings: true

          server:
            limiter: false
            image_proxy: false
            secret_key: "github-actions-secret-key"

          search:
            formats:
              - html
              - json
          EOF

      - name: Start SearXNG
        run: |
          docker run -d --name searxng -p 8080:8080 \
            -v $(pwd)/searxng-config/settings.yml:/etc/searxng/settings.yml:ro \
            -e SEARXNG_BASE_URL=http://localhost:8080 \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            searxng/searxng
          sleep 20

      - name: Discover companies with ICP Scout
        env:
          SEARXNG_URL: http://localhost:8080
        run: |
          cd icp-scout
          node src/cli.mjs discover \
            "B2B outbound sales agency in United States" \
            --exclude directory,marketplace,review \
            --limit 50 \
            --output ../icp-companies.json
          cd ..

      - name: Extract domains
        run: |
          python3 << 'EOF'
          import json

          with open('icp-companies.json') as f:
              data = json.load(f)

          leads = data.get('leads', [])
          print(f"Total leads: {len(leads)}")

          domains = []
          for l in leads:
              d = l.get('domain')
              s = l.get('score', 0)
              if d and s >= 50:
                  domains.append(d)
                  print(f"  {d} (score {s})")

          with open('domains.txt', 'w') as f:
              for d in domains:
                  f.write(d + '\n')

          print(f"\nWrote {len(domains)} domains")
          EOF

      - name: Install ColdReach
        run: pip install coldreach

      - name: Find emails with ColdReach
        run: |
          python3 << 'EOF'
          import json
          import subprocess
          import os

          with open('domains.txt') as f:
              domains = [line.strip() for line in f if line.strip()]

          print(f"Processing {len(domains)} domains")

          all_emails = []
          for domain in domains:
              print(f"\n=== {domain} ===")
              try:
                  result = subprocess.run(
                      ['coldreach', 'find', '--domain', domain, '--json', '--quick'],
                      capture_output=True,
                      text=True,
                      timeout=60
                  )
                  if result.returncode != 0:
                      print(f"  Failed: {result.stderr[:200]}")
                      continue

                  data = json.loads(result.stdout)
                  emails = data.get('emails', data.get('results', []))
                  for e in emails:
                      if isinstance(e, dict):
                          addr = e.get('email') or e.get('address')
                          if addr:
                              all_emails.append({'email': addr, 'domain': domain})
                              print(f"  {addr}")
                      elif isinstance(e, str):
                          all_emails.append({'email': e, 'domain': domain})
                          print(f"  {e}")

              except subprocess.TimeoutExpired:
                  print(f"  Timeout")
              except Exception as e:
                  print(f"  Error: {e}")

          with open('emails-full.json', 'w') as f:
              json.dump(all_emails, f, indent=2)

          print(f"\nTotal emails: {len(all_emails)}")
          EOF

      - name: Filter role inboxes
        run: |
          python3 << 'EOF'
          import json

          with open('emails-full.json') as f:
              emails = json.load(f)

          ROLE_LOCALS = {
              'sales', 'info', 'press', 'support', 'hr', 'recruiting', 'jobs',
              'careers', 'hello', 'contact', 'team', 'billing', 'accounts',
              'marketing', 'media', 'pr', 'legal', 'admin', 'office', 'help',
              'enquiries', 'inquiries', 'enquiry', 'reception', 'general',
              'noreply', 'no-reply', 'postmaster', 'webmaster', 'abuse',
              'newsletter', 'feedback', 'security', 'it', 'dev', 'engineering'
          }

          personal = []
          seen = set()
          for entry in emails:
              email = entry['email']
              local = email.split('@')[0].lower()
              if local in ROLE_LOCALS:
                  continue
              if local.startswith(('noreply', 'no-reply', 'donotreply')):
                  continue
              if email in seen:
                  continue
              seen.add(email)
              personal.append(entry)

          with open('leads.json', 'w') as f:
              json.dump([{'email': e['email']} for e in personal], f, indent=2)

          with open('personal-emails.json', 'w') as f:
              json.dump(personal, f, indent=2)

          print(f"Personal emails: {len(personal)}")
          for e in personal:
              print(f"  {e['email']}")
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f domains.txt icp-companies.json emails-full.json leads.json personal-emails.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update leads"
          git push
