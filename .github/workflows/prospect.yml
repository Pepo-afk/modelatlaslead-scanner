name: Find Model String

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenGTM
        run: pip install opengtm

      - name: Locate model string
        run: |
          echo "=== Files containing gemini-2.0-flash ==="
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          grep -rn "gemini-2.0-flash" $SITE/opengtm/ || echo "not found in opengtm package"

          echo ""
          echo "=== Files containing gemini ==="
          grep -rln "gemini" $SITE/opengtm/ || echo "no files"

          echo ""
          echo "=== Any config.py or similar ==="
          find $SITE/opengtm/ -name "*.py" | head -30

          echo ""
          echo "=== Print the file that defines the model ==="
          FILE=$(grep -rl "gemini-2.0-flash" $SITE/opengtm/ | head -1)
          if [ -n "$FILE" ]; then
            echo "FILE: $FILE"
            cat "$FILE"
          fi 
