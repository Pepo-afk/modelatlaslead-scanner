name: Discover Prospects

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone ICP Scout
        run: git clone https://github.com/GrimmReaper0/icp-scout.git

      - name: Create SearXNG settings with JSON enabled
        run: |
          mkdir -p searxng-config
          cat > searxng-config/settings.yml << 'EOF'
          use_default_settings: true

          server:
            limiter: false
            image_proxy: false
            secret_key: "github-actions-secret-key"

          search:
            formats:
              - html
              - json
          EOF

      - name: Start SearXNG
        run: |
          docker run -d --name searxng -p 8080:8080 \
            -v $(pwd)/searxng-config/settings.yml:/etc/searxng/settings.yml:ro \
            -e SEARXNG_BASE_URL=http://localhost:8080 \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            searxng/searxng
          sleep 20

      - name: Verify SearXNG JSON works
        run: |
          curl -s "http://localhost:8080/search?q=test&format=json" | head -c 200
          echo ""

      - name: Discover companies with ICP Scout
        env:
          SEARXNG_URL: http://localhost:8080
        run: |
          cd icp-scout
          node src/cli.mjs discover \
            "B2B outbound sales agency in United States" \
            --exclude directory,marketplace,review \
            --limit 50 \
            --output ../icp-companies.json

      - name: Extract domains
        run: |
          python3 << 'EOF'
          import json

          with open('icp-companies.json') as f:
              data = json.load(f)

          companies = data if isinstance(data, list) else data.get('companies', data.get('results', []))
          domains = [c.get('domain') for c in companies if c.get('domain')]

          with open('domains.txt', 'w') as f:
              for d in domains:
                  f.write(d + '\n')

          print(f"Found {len(domains)} domains")
          for d in domains[:15]:
              print(f"  {d}")
          EOF

      - name: Find SDRs with ColdReach
        run: |
          pip install coldreach
          python3 << 'EOF'
          import json
          import subprocess
          import re

          with open('domains.txt') as f:
              domains = [line.strip() for line in f if line.strip()]

          all_leads = []
          for domain in domains:
              print(f"Finding SDRs at: {domain}")
              try:
                  result = subprocess.run(
                      ['coldreach', 'find', '--domain', domain, '--json'],
                      capture_output=True,
                      text=True,
                      timeout=120
                  )
                  if result.returncode != 0:
                      print(f"  ColdReach failed: {result.stderr[:200]}")
                      continue

                  emails_data = json.loads(result.stdout)
                  for entry in emails_data.get('emails', []):
                      title = entry.get('title', '').lower()
                      if re.search(r'\b(sdr|bdr|sales development|business development)\b', title):
                          all_leads.append({
                              'email': entry['email'],
                              'name': entry.get('name', ''),
                              'title': title,
                              'company': domain
                          })
              except Exception as e:
                  print(f"  Error: {e}")

          seen = set()
          unique_leads = []
          for lead in all_leads:
              if lead['email'] not in seen:
                  seen.add(lead['email'])
                  unique_leads.append(lead)

          with open('leads.json', 'w') as f:
              json.dump([{'email': l['email']} for l in unique_leads], f, indent=2)

          print(f"\nTotal SDR/BDR leads found: {len(unique_leads)}")
          print(json.dumps(unique_leads[:10], indent=2))
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add domains.txt leads.json icp-companies.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update prospects"
          git push
