name: Find LinkedIn SDRs

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find LinkedIn Profiles
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_ZONE: ${{ secrets.BRIGHT_DATA_ZONE }}
        run: python find_linkedin.py

      - name: Verify Emails via Free API
        run: python find_emails.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add linkedin-profiles.json leads.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update LinkedIn profiles and leads"
          git push
